else if(ph==='night'){
if(!me.alive)h=`<h2>Du bist ausgeschieden</h2>${img('tod')}${rb()}`;
else if(s==='thief'&&v.thiefDone!==undefined)h=!v.thiefDone?`<h2>Dieb</h2><p>Tippe eine der beiden Karten an oder behalte deine Rolle.</p><div style="display:flex;gap:10px;justify-content:center">${v.spare.map((q,i)=>`<div onclick="gs=${i};render()" style="width:44%;border-radius:12px;padding:4px;${gs===i?'outline:3px solid var(--ac)':''}">${img(q,'100%')}<small>${R[q][0]}</small></div>`).join('')}</div>`+ib('bestaetigen-dieb','Tauschen','thief(gs)',gs===null)+(v.must?'<p><small>Beide Karten sind Werwölfe – du musst eine nehmen.</small></p>':ib('weiter','Meine Rolle behalten','thief(-1)')):`<h2>Du bist jetzt:</h2>${img(me.role)}<h2>${R[me.role][0]}</h2>${ib('weiter','Weiter','nx()')}`;
else if(s==='amor'&&me.role==='amor')h=`<h2>Amor</h2><p>Wähle zwei Spieler, die sich verlieben.</p>`+list(al,asel,0,'pa')+ib('liebespaar','Verbinden','lv()',asel.length!==2);
else if(s==='lovers'&&v.partner)h=`<h2>Ihr seid verliebt!</h2>${img('liebespaar')}<p>Dein Partner: <b>${nm(v.partner)}</b></p>`+(v.lok?'<p>Warte auf deinen Partner …</p>':ib('weiter','Weiter','lok()'));
else if(s==='prot'&&me.role==='heiler')h=`<h2>Heiler</h2><p>Wen schützt du? Dieselbe Person darf nicht zwei Nächte hintereinander geschützt werden.</p>`+(v.last?`<p><small>Gesperrt: ${nm(v.last)} (letzte Nacht geschützt)</small></p>`:'')+list(al,gs,0,'pg',v.last)+ib('bestaetigen-heiler','Schützen','prot()',!gs);
else if(s==='wolves'&&me.role==='werwolf')h=`<h2>Wen fresst ihr?</h2>`+list(p=>p.alive&&!v.mates.includes(p.id),v.mine,v.picks,'pick')+ib('bestaetigen-werwolf',v.ok?'Warte auf die anderen …':'Bestätigen','ok()',!(v.can&&!v.ok))+`<small>${c.u?'Alle müssen denselben Namen wählen.':'Die Mehrheit entscheidet.'}</small>`;
else if(s==='seer'&&me.role==='seherin')h=!v.seen?`<h2>Wen willst du sehen?</h2>`+list(p=>p.alive&&p.id!==me.id,ssel,0,'ps')+ib('bestaetigen-seherin','Ansehen','see()',!ssel):`<h2>${nm(v.seen.id)}</h2>${c.seerTrue?`${img(v.seen.role)}<p>ist: <b>${R[v.seen.role][0]}</b></p>`:`${img(v.seen.w?'werwolf':'dorfbewohner')}<p>${v.seen.w?'ist ein Werwolf!':'ist kein Werwolf.'}</p>`}${ib('weiter','Weiter','nx()')}`;
else if(s==='heal'&&me.role==='hexe'){const can=v.pot.heal&&v.victim;h=`<h2>Hexe</h2><p>${v.victim?'Opfer der Werwölfe: '+nm(v.victim):'Es gab kein Opfer.'}</p>`+ib('heiltrank',!v.pot.heal?'Heiltrank verbraucht':can?'Heiltrank einsetzen':'Kein Opfer','heal(1)',!can)+ib('weiter',can?'Nicht einsetzen':'Weiter','heal(0)')}
else if(s==='poison'&&me.role==='hexe')h=`<h2>Hexe</h2>`+(v.pot.poison?`<p>Wen vergiftest du?</p>`+list(p=>p.alive&&p.id!==me.id,px,0,'pois'):'')+ib('gifttrank',!v.pot.poison?'Gifttrank verbraucht':px?'Vergifte '+nm(px):'Gifttrank einsetzen','poison(1)',!(v.pot.poison&&px))+ib('weiter',v.pot.poison?'Nicht einsetzen':'Weiter','poison(0)');
else h=`<h2>Das Dorf schläft …</h2><div style="font-size:90px">🌙</div>`}
else if(ph==='day'){const dead=v.dead&&v.dead.length,al1=p=>p.alive&&(!v.cands||v.cands.includes(p.id))&&(c.selfW||p.id!==me.id),
news=()=>dead?dc():'<p>Niemand ist gestorben.</p>',arrow=t=>ib('weiter',t,'rd=1;render()'),
ttl=s==='wahl'&&(rd||!v.kind)&&me.alive?'Wer wird Hauptmann?':s==='cap'?'Wahl beendet':(s==='vote'||v.kind==='v')?'Der Abend dämmert':'Der Morgen graut';
h=`<h2>${ttl}</h2>`+(!me.alive&&!((v.dead||[]).some(x=>x.id===me.id)&&['wahl','talk','jaeger','nachf','out'].includes(s))?`${img('tod','45%')}<p><b>Du bist ausgeschieden.</b></p>${rb()}`:'');
if(s==='wahl'){if(me.alive&&(rd||!v.kind))h+=(v.cands?`<p>Gleichstand! Stichwahl ${v.rnd-1} von 2 zwischen ${v.cands.map(nm).join(' und ')}. Es kann nur noch zwischen ihnen gewählt werden.${v.rnd>=3?' Bei erneutem Gleichstand entscheidet das Los.':''}</p>`+resB():'<p>Wen wählt ihr zum Hauptmann? Seine Stimme zählt doppelt.</p>')+(v.voted?`<p>Deine Stimme ist abgegeben. ${v.n} von ${v.total} Stimmen sind da.</p>`+miss():list(al1,vsel,0,'pv')+ib('hauptmann','Wählen','vote()',!vsel));
else h+=news()+(me.alive?arrow('Weiter zur Wahl'):`<p>Die Wahl läuft … ${v.n} von ${v.total} Stimmen sind da.</p>`+miss())}
else if(s==='cap')h+=capB()+resB()+hb(['go()','Nacht beginnen']);
else if(s==='talk')h+=(v.news?dcMe():news())+capB()+(v.res&&v.res.k==='w'&&(v.capNew||v.capNone)?resB():'')+(v.tEnd?`<p class=tm>⏳ ${tm()}</p>`:'')+(v.tEnd&&host?'<button onclick="more()">+2 Minuten</button>':'')+`<p>${me.alive?'Diskutiert!':'<b>Du darfst nicht mehr diskutieren!</b>'}</p>`+hb(['vs()','Abstimmung starten']);
else if(s==='jaeger')h+=(v.actor===me.id&&rd?`<h2>Du bist der Jäger!</h2><p>Wen nimmst du mit?</p>`+list(al,gs,0,'pg')+ib('bestaetigen-jaeger','Schießen','shoot()',!gs):news()+(v.actor===me.id?arrow('Ziel wählen'):'<p>Der Jäger wählt sein Ziel …</p>'));
else if(s==='nachf')h+=(v.actor===me.id&&rd?`<h2>Du warst Hauptmann</h2><p>Wer wird dein Nachfolger?</p>`+list(al,gs,0,'pg')+ib('hauptmann','Ernennen','nachf()',!gs):news()+(v.actor===me.id?arrow('Neuen Hauptmann benennen'):'<p>Der Hauptmann bestimmt seinen Nachfolger …</p>'));
else if(s==='tie')h+=`<p>Gleichstand zwischen ${v.cands.map(nm).join(' und ')}!</p>`+resB()+(v.actor===me.id?`<p>Als Hauptmann entscheidest du, wer ausscheidet.</p>`+list(p=>v.cands.includes(p.id),gs,0,'pg')+ib('hauptmann','Ausscheiden lassen','tie()',!gs):'<p>Der Hauptmann entscheidet …</p>');
else if(s==='vote')h+=(me.alive&&!v.voted?list(p=>p.alive&&p.id!==me.id,vsel,0,'pv')+ib('abstimmung','Abstimmen','vote()',!vsel):`<p>${me.alive?'Deine Stimme ist abgegeben. ':''}${v.n} von ${v.total} Stimmen sind da.</p>`+miss())+(host?'<button onclick="tally()">Jetzt auszählen</button>':'');
else h+=(v.news&&v.capNew?dcMe()+capB():dead?dc():'<p>Gleichstand: Niemand scheidet aus.</p>')+(v.res&&v.res.k==='v'?resB():'')+hb(['go()','Nacht beginnen'])}
else{const w=v.win;h=`<h2>${w.w==='dorf'?'Das Dorf gewinnt!':w.w==='wolf'?'Die Werwölfe gewinnen!':'Das Liebespaar gewinnt!'}</h2>${img(w.w==='dorf'?'sieg-dorf':w.w==='wolf'?'sieg-werwolf':'sieg-liebespaar')}`+(w.ids.length?`<p><b>Gewinner:</b> ${w.ids.map(nmc).join(', ')}</p>`:'')+P.map(p=>`<div class="${p.alive?'':'dead'}">${cp(p.id)}${v.lovers&&v.lovers.includes(p.id)?'❤ ':''}${p.name}: ${R[p.role][0]}</div>`).join('')+hb(['again()','Neues Spiel'])}}
const ig=v&&v.phase!=='lobby';
if(v&&rv&&!v.me.alive&&!v.pm)h=`<h2>Deine Rolle</h2>${img(v.me.role)}<h2>${R[v.me.role][0]}</h2>`+ib('weiter','Zurück','rv=0;render()');
$.innerHTML=(ig&&v.phase!=='over'&&v.captain===v.me.id&&v.me.alive?'<img class=cb src="images/hauptmann.png" onerror="this.remove()">':'')+(ig?'<button class=x onclick="mo=1;render()">✕</button>':'')+(mo&&ig?`<div class=ov><h2>Spiel</h2>${v.host===v.me.id&&v.phase==='roles'&&!v.ready?'<button onclick="gof()">Trotzdem starten</button>':''}${v.host===v.me.id&&v.step==='wahl'?'<button onclick="tw()">Wahl jetzt auswerten</button>':''}${v.host===v.me.id&&(v.step==='jaeger'||v.step==='nachf'||v.step==='tie')?`<button onclick="sk()">${v.step==='jaeger'?'Jäger überspringen':v.step==='nachf'?'Hauptmann zufällig bestimmen':'Zufällig entscheiden'}</button>`:''}${v.host===v.me.id?'<button onclick="reset()">Spiel für alle beenden</button>':''}<button onclick="leave(1)">Nur mich abmelden</button><button class=p onclick="mo=0;render()">Zurück zum Spiel</button></div>`:'')+h+(room&&!ig?'<p><small><a href="#" style="color:inherit" onclick="leave();return false">Spiel verlassen</a></small></p>':'')}
const reset=()=>{mo=0;send({t:'reset'})};
function leave(f){if(!f&&!confirm('Spiel wirklich verlassen?'))return;localStorage.removeItem(K('room'));location.href=location.pathname+(Q?'?p='+Q:'')}
setInterval(()=>{if(v&&v.step==='talk'&&v.tEnd)render()},1000);
if(room)connect();else render();
</script></body></html>
