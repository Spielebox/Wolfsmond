<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wolfsmond</title>
<meta name="apple-mobile-web-app-title" content="Wolfsmond">
<link rel="icon" href="images/favicon.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d17;--fg:#e8e6f0;--ac:#e0a458;--rd:#b3202a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) center/cover fixed;color:var(--fg);font:16px/1.4 system-ui,sans-serif;text-align:center}
body.n{background-image:linear-gradient(#0b0d17cc,#0b0d17cc),url(images/hintergrund-nacht.png)}
body.d{background-image:linear-gradient(#0b0d1799,#0b0d1799),url(images/hintergrund-tag.png)}
main{max-width:460px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1,h2{font-family:'Pirata One',Georgia,serif;font-weight:400;color:var(--ac);margin:.4em 0}
h1{font-size:3em}h2{font-size:1.8em}
button,input{font:inherit;padding:13px;border-radius:10px;border:1px solid #ffffff33;background:#1b1f33;color:var(--fg);width:100%;margin:5px 0}
button.p{background:var(--ac);color:#15110a;border:0;font-weight:700}
button:disabled{opacity:.4}
.l button.s{outline:2px solid var(--ac)}
.dead{opacity:.5;text-decoration:line-through}
img.c{width:68%;border-radius:12px}
.code{font:700 2.4em ui-monospace,monospace;letter-spacing:.2em;color:var(--ac)}
small{opacity:.7}
.hi{height:1.2em;vertical-align:middle}
select{font:inherit;padding:8px;border-radius:8px;background:#1b1f33;color:var(--fg);border:1px solid #ffffff33}
.l button:disabled{opacity:.35}
.ib{background:none;border:0;padding:4px;width:auto;margin:6px auto;display:block;color:inherit}
.ib img{height:110px;display:block;margin:auto;transition:transform .15s}
.ib .cap{display:block;font-size:.8em;opacity:.8;margin-top:2px}
.ib:disabled{opacity:.35}
.ib.on img{filter:drop-shadow(0 0 10px var(--ac));transform:scale(1.08)}
.ib.fb{background:var(--ac);color:#15110a;width:100%;padding:13px;border-radius:10px;border:0}
.ib.fb .cap{font-size:1em;opacity:1;font-weight:700}
.ib.fb.on{outline:3px solid #fff}
.x{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;width:40px;height:40px;padding:0;border-radius:50%;background:#0b0d17b3;font-size:20px;line-height:1;z-index:5;margin:0}
.ov{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;justify-content:center;padding:24px;z-index:9}
.logo{display:block;width:72%;max-width:300px;margin:10px auto;border-radius:14px}
</style></head><body><main id="a"></main><script>
const VER='25.10.-6';
const WS='wss://wolfsmond.spam-lama.workers.dev';
const R={werwolf:['Werwolf','🐺'],dorfbewohner:['Dorfbewohner','🧑‍🌾'],seherin:['Seherin','🔮'],hexe:['Hexe','🧪'],jaeger:['Jäger','🏹'],amor:['Amor','💘'],heiler:['Heiler','💚'],maedchen:['Blinzelndes Mädchen','👀']};
const F={tod:'🪦','sieg-dorf':'🎉','sieg-werwolf':'🐺',weiter:'➡️','sieg-liebespaar':'💞',hauptmann:'🎖️',liebespaar:'💞'},E=r=>R[r]?R[r][1]:F[r]||'🌙',$=document.getElementById('a'),U=new URLSearchParams(location.search),Q=U.get('p')||'',K=k=>'wm_'+k+Q,id=localStorage[K('id')]||(localStorage[K('id')]=crypto.randomUUID());
let ws,v,rt,hiddenAt=0,show=0,hx=0,px=null,vsel=null,ssel=null,asel=[],gs=null,mo=0,room=(U.get('r')||'').toUpperCase()||localStorage[K('room')],name=localStorage[K('name')]||(Q?'Test'+Q:'');
const send=o=>ws.send(JSON.stringify(o)),nm=i=>v.players.find(p=>p.id===i)?.name||'?',
img=(r,w)=>`<img class="c" ${w?`style="width:${w}"`:''} src="images/${r}.png" alt="" onerror="this.outerHTML='<div style=font-size:80px>${E(r)}</div>'">`;
const go=()=>{unlock();send({t:'go'})},vs=()=>send({t:'vs'}),tally=()=>send({t:'tally'}),again=()=>send({t:'again'}),ok=()=>send({t:'ok'}),nx=()=>send({t:'next'}),lok=()=>send({t:'lok'}),
cfg=(k,x)=>send({t:'cfg',k,v:x}),pick=i=>send({t:'pick',id:i}),ps=i=>{ssel=ssel===i?null:i;render()},see=()=>ssel&&send({t:'see',id:ssel}),
pv=i=>{vsel=vsel===i?null:i;render()},vote=()=>vsel&&send({t:'vote',id:vsel}),pg=i=>{gs=gs===i?null:i;render()},
pa=i=>{asel=asel.includes(i)?asel.filter(x=>x!==i):asel.length<2?[...asel,i]:asel;render()},lv=()=>send({t:'lv',ids:asel}),
prot=()=>gs&&send({t:'prot',id:gs}),shoot=()=>gs&&send({t:'shoot',id:gs}),nachf=()=>gs&&send({t:'nachf',id:gs}),
heal=y=>send({t:'heal',yes:y}),pois=i=>{px=px===i?null:i;render()},poison=y=>send({t:'poison',id:y?px:null});
const au=new Audio();let lastN=null,cq=[],pl=0;
const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};
function unlock(){wl();try{au.muted=true;au.src='audio/nacht-beginnt.m4a';au.play().then(()=>{if(!pl){au.pause();au.muted=false}}).catch(()=>{au.muted=false})}catch(e){}}
function sound(){wl();au.muted=false;au.src='audio/nacht-beginnt.m4a';au.play().catch(()=>{})}
function pump(){if(pl||!cq.length)return;pl=1;const c=cq.shift(),fin=()=>{if(!pl)return;pl=0;au.onended=au.onerror=null;send({t:'cd',n:c.n});pump()};au.onended=au.onerror=fin;au.muted=false;au.src=`audio/${c.id}.m4a`;au.play().catch(fin)}
function join(c){room=c||document.getElementById('rc').value.toUpperCase().trim();name=document.getElementById('nn').value.trim()||'Spieler';if(!room)return;localStorage[K('room')]=room;localStorage[K('name')]=name;connect()}
function connect(){clearTimeout(rt);const old=ws;ws=new WebSocket(`${WS}/ws?room=${room}&id=${id}&name=${encodeURIComponent(name||'Spieler')}`);
ws.onopen=()=>{if(old&&old!==ws){old.onclose=null;old.onmessage=null;try{old.close()}catch(e){}}};
ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.err){alert(d.err);localStorage.removeItem(K('room'));location.href=location.pathname+(Q?'?p='+Q:'');return}
if(d.cue){if(lastN===null)lastN=d.cue.n;else if(d.cue.n!==lastN){lastN=d.cue.n;cq.push(d.cue);pump()}}else if(lastN===null)lastN=0;
if(!v||v.phase!==d.phase||v.step!==d.step){hx=0;px=null;show=0;vsel=null;ssel=null;asel=[];gs=null}v=d;render()};
ws.onclose=()=>{rt=setTimeout(connect,2000)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(room&&(!ws||ws.readyState!==1||Date.now()-hiddenAt>5000))connect()});
const ib=(f,c,fn,d,on)=>`<button class="ib${on?' on':''}" ${d?'disabled':''} onclick="${fn}"><img src="images/${f}.png" alt="" onerror="this.parentNode.classList.add('fb');this.remove()"><span class=cap>${c}</span></button>`;
const cp=i=>v.captain===i?'<img class=hi src="images/hauptmann.png" onerror="this.remove()"> ':'';
const list=(f,sel,cnt,fn,dis)=>`<div class=l>${v.players.filter(f).map(p=>{const c=cnt?.[p.id]||0,on=Array.isArray(sel)?sel.includes(p.id):sel===p.id;return`<button class="${on?'s':''}" ${p.id===dis?'disabled':''} style="${c?`background:rgba(179,32,42,${Math.min(.2+.3*c,.95)})`:''}" onclick="${fn}('${p.id}')">${cp(p.id)}${p.name}${c?' · '+c:''}</button>`}).join('')}</div>`;
const HOW={wolf:'Du bist in der Nacht gestorben.',gift:'Du bist in der Nacht gestorben.',vote:'Du bist bei der Abstimmung ausgeschieden.',liebe:'Du bist aus Liebeskummer gestorben.',jaeger:'Der Jäger hat dich erschossen.'};
const logo=`<img class=logo src="images/logo.png" alt="Wolfsmond" onerror="this.outerHTML='<h1>Wolfsmond</h1>'">`;
function render(){
document.body.className=v?(v.phase==='night'?'n':v.phase==='day'?'d':''):'';
let h='';
if(!room)h=`${logo}<input id=nn placeholder="Dein Name" value="${name||''}"><button class=p onclick="join(Math.random().toString(36).slice(2,6).toUpperCase())">Neues Spiel</button><input id=rc placeholder="Raumcode" maxlength=4><button onclick="join()">Beitreten</button><p><small>Version ${VER}</small></p>`;
else if(!v)h='<h2>Verbinde …</h2>';
else{const me=v.me,host=v.host===me.id,ph=v.phase,s=v.step,P=v.players,c=v.cfg,rn=i=>R[P.find(p=>p.id===i).role][0],nmc=i=>cp(i)+nm(i),al=p=>p.alive,
sm=i=>`<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0">${img('tod','56px')}<b>${nmc(i)}</b><small>(${rn(i)})</small></div>`,
dc=()=>{const d=v.dead||[],o=d.filter(x=>x.id!==me.id),m=d.find(x=>x.id===me.id);return(o.length?`<p>${v.kind==='n'?'In der Nacht starb:':'Durch die Abstimmung scheidet aus:'}</p>`+o.map(x=>sm(x.id)).join(''):'')+(m?`<div>${img('tod','62%')}<h2>${HOW[m.how]}</h2><p>Du warst: ${rn(me.id)}</p></div>`:'')},
hb=t=>host?`<button class=p onclick="${t[0]}">${t[1]}</button>`:'';
if(ph==='lobby')h=`${logo}<small>Raumcode</small><div class=code>${room}</div><p>${P.length} Spieler (mindestens 4)</p>${P.map(p=>`<div>${p.name}</div>`).join('')}`+(host?`<div style="text-align:left;margin:14px 0;line-height:2.1"><b>Einstellungen</b><br><label><input type=checkbox style="width:auto" ${c.u?'checked':''} onchange="cfg('u',this.checked)"> Werwölfe müssen einstimmig sein</label><br><label><input type=checkbox style="width:auto" ${c.cap?'checked':''} onchange="cfg('cap',this.checked)"> Hauptmann dabei</label><br><label>Wahl: <select onchange="cfg('capWhen',this.value)"><option value=n1 ${c.capWhen==='n1'?'selected':''}>nach der ersten Nacht</option><option value=start ${c.capWhen==='start'?'selected':''}>zu Spielbeginn</option></select></label><br><label><input type=checkbox style="width:auto" ${c.heiler?'checked':''} onchange="cfg('heiler',this.checked)"> Heiler dabei (ab 6 Spielern)</label></div><button class=p ${P.length<4?'disabled':''} onclick="send({t:'start'})">Spiel starten</button>`:'<p>Der Host startet gleich das Spiel.</p>')+`<p><small>Version ${VER}</small></p>`;
else if(ph==='roles'){const r=me.role;h=`<h2>Deine Rolle</h2><div onclick="show=!show;render()">${img(show?r:'kartenrueckseite')}</div><h2>${show?R[r][0]:'Antippen zum Aufdecken'}</h2>`+(show&&v.mates?`<p>Werwölfe: ${v.mates.map(nm).join(', ')}</p>`:'')+(host?'<button onclick="sound()">🔊 Ton testen (Erzähler-Handy)</button><button class=p onclick="go()">Nacht beginnen</button>':'')}
else if(ph==='night'){
if(!me.alive)h=`<h2>Du bist ausgeschieden</h2>${img('tod')}`;
else if(s==='amor'&&me.role==='amor')h=`<h2>Amor</h2><p>Wähle zwei Spieler, die sich verlieben.</p>`+list(al,asel,0,'pa')+ib('liebespaar','Verbinden','lv()',asel.length!==2);
else if(s==='lovers'&&v.partner)h=`<h2>Ihr seid verliebt!</h2>${img('liebespaar')}<p>Dein Partner: <b>${nm(v.partner)}</b></p>`+(v.lok?'<p>Warte auf deinen Partner …</p>':ib('weiter','Weiter','lok()'));
else if(s==='prot'&&me.role==='heiler')h=`<h2>Heiler</h2><p>Wen schützt du? Dieselbe Person darf nicht zwei Nächte hintereinander geschützt werden.</p>`+(v.last?`<p><small>Gesperrt: ${nm(v.last)} (letzte Nacht geschützt)</small></p>`:'')+list(al,gs,0,'pg',v.last)+ib('bestaetigen-heiler','Schützen','prot()',!gs);
else if(s==='wolves'&&me.role==='werwolf')h=`<h2>Wen fresst ihr?</h2>`+list(p=>p.alive&&!v.mates.includes(p.id),v.mine,v.picks,'pick')+ib('bestaetigen-werwolf',v.ok?'Warte auf die anderen …':'Bestätigen','ok()',!(v.can&&!v.ok))+`<small>${c.u?'Alle müssen denselben Namen wählen.':'Die Mehrheit entscheidet.'}</small>`;
else if(s==='seer'&&me.role==='seherin')h=!v.seen?`<h2>Wen willst du sehen?</h2>`+list(p=>p.alive&&p.id!==me.id,ssel,0,'ps')+ib('bestaetigen-seherin','Ansehen','see()',!ssel):`<h2>${nm(v.seen.id)}</h2>${img(v.seen.w?'werwolf':'dorfbewohner')}<p>${v.seen.w?'ist ein Werwolf!':'ist kein Werwolf.'}</p>${ib('weiter','Weiter','nx()')}`;
else if(s==='heal'&&me.role==='hexe'){const can=v.pot.heal&&v.victim;h=`<h2>Hexe</h2><p>${v.victim?'Opfer der Werwölfe: '+nm(v.victim):'Die Werwölfe haben niemanden gewählt.'}</p>`+ib('heiltrank',!v.pot.heal?'Heiltrank verbraucht':can?'Heiltrank einsetzen':'Kein Opfer','heal(1)',!can)+ib('weiter',can?'Nicht einsetzen':'Weiter','heal(0)')}
else if(s==='poison'&&me.role==='hexe')h=`<h2>Hexe</h2>`+(v.pot.poison?`<p>Wen vergiftest du?</p>`+list(p=>p.alive&&p.id!==me.id,px,0,'pois'):'')+ib('gifttrank',!v.pot.poison?'Gifttrank verbraucht':px?'Vergifte '+nm(px):'Gifttrank einsetzen','poison(1)',!(v.pot.poison&&px))+ib('weiter',v.pot.poison?'Nicht einsetzen':'Weiter','poison(0)');
else h=`<h2>Das Dorf schläft …</h2><div style="font-size:90px">🌙</div>`}
else if(ph==='day'){const dead=v.dead&&v.dead.length;
const ttl=s==='wahl'?'Wer wird Hauptmann?':(s==='vote'||s==='out')?'Der Abend dämmert':'Der Morgen graut';
h=`<h2>${ttl}</h2>`+(s==='vote'&&!me.alive?'<p><small>Du bist ausgeschieden.</small></p>':'');
if(s==='wahl')h+=(dead?dc():'')+(v.retry?'<p>Gleichstand – bitte noch einmal wählen.</p>':'')+(me.alive&&!v.voted?`<p>Wen wählt ihr zum Hauptmann? Seine Stimme zählt doppelt.</p>`+list(al,vsel,0,'pv')+ib('hauptmann','Wählen','vote()',!vsel):`<p>${v.n} von ${v.total} Stimmen sind da.</p>`);
else if(s==='talk')h+=(dead?dc():'<p>Niemand ist gestorben.</p>')+`<p>${me.alive?'Diskutiert!':'<b>Du darfst nicht mehr diskutieren!</b>'}</p>`+hb(['vs()','Abstimmung starten']);
else if(s==='jaeger')h+=dc()+(v.actor===me.id?`<h2>Du bist der Jäger!</h2><p>Wen nimmst du mit?</p>`+list(al,gs,0,'pg')+ib('bestaetigen-jaeger','Schießen','shoot()',!gs):'<p>Der Jäger wählt sein Ziel …</p>');
else if(s==='nachf')h+=dc()+(v.actor===me.id?`<h2>Du warst Hauptmann</h2><p>Wer wird dein Nachfolger?</p>`+list(al,gs,0,'pg')+ib('hauptmann','Ernennen','nachf()',!gs):'<p>Der Hauptmann bestimmt seinen Nachfolger …</p>');
else if(s==='vote')h+=(me.alive&&!v.voted?list(p=>p.alive&&p.id!==me.id,vsel,0,'pv')+ib('abstimmung','Abstimmen','vote()',!vsel):`<p>${me.alive?'Deine Stimme ist abgegeben. ':''}${v.n} von ${v.total} Stimmen sind da.</p>`)+(host?'<button onclick="tally()">Jetzt auszählen</button>':'');
else h+=(dead?dc():'<p>Gleichstand: Niemand scheidet aus.</p>')+hb(['go()','Nacht beginnen'])}
else{const w=v.win;h=`<h2>${w.w==='dorf'?'Das Dorf gewinnt!':w.w==='wolf'?'Die Werwölfe gewinnen!':'Das Liebespaar gewinnt!'}</h2>${img(w.w==='dorf'?'sieg-dorf':w.w==='wolf'?'sieg-werwolf':'sieg-liebespaar')}`+(w.ids.length?`<p><b>Gewinner:</b> ${w.ids.map(nmc).join(', ')}</p>`:'')+P.map(p=>`<div class="${p.alive?'':'dead'}">${cp(p.id)}${v.lovers&&v.lovers.includes(p.id)?'❤ ':''}${p.name}: ${R[p.role][0]}</div>`).join('')+hb(['again()','Neues Spiel'])}}
const ig=v&&v.phase!=='lobby';
$.innerHTML=(ig?'<button class=x onclick="mo=1;render()">✕</button>':'')+(mo&&ig?`<div class=ov><h2>Spiel</h2>${v.host===v.me.id?'<button onclick="reset()">Spiel für alle beenden</button>':''}<button onclick="leave(1)">Nur mich abmelden</button><button class=p onclick="mo=0;render()">Zurück zum Spiel</button></div>`:'')+h+(room&&!ig?'<p><small><a href="#" style="color:inherit" onclick="leave();return false">Spiel verlassen</a></small></p>':'')}
const reset=()=>{mo=0;send({t:'reset'})};
function leave(f){if(!f&&!confirm('Spiel wirklich verlassen?'))return;localStorage.removeItem(K('room'));location.href=location.pathname+(Q?'?p='+Q:'')}
if(room)connect();else render();
</script></body></html>
